name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-clang
            os: macos-latest
            cc: clang
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-24.04
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Install build tools
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            exit 0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
        run: cmake --preset prod

      - name: Verify production build type
        run: tools/require-cmake-release-build build/prod

      - name: Build
        run: cmake --build --preset prod

      - name: Test
        run: |
          set -euo pipefail
          tools/require-cmake-release-build build/prod
          ctest --preset prod

  embedded:
    name: ubuntu-embedded
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Install embedded build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            libcrypt-dev \
            libncurses-dev \
            libpcre2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            php-cli \
            php-dev \
            zlib1g-dev

      - name: Normalize embedded MariaDB archive source mtimes
        run: tools/normalize-mariadb-embedded-cache-mtimes

      - name: Cache embedded MariaDB archive build
        uses: actions/cache@v4
        with:
          path: build/mariadb-embedded
          key: ${{ runner.os }}-mariadb-embedded-${{ hashFiles('mariadb/**', 'cmake/mariadb-embedded-baseline.cmake', 'tools/mariadb-embedded-build') }}

      - name: Build MariaDB embedded archive
        timeout-minutes: 30
        run: tools/mariadb-embedded-build ensure

      - name: Verify MariaDB embedded production build type
        run: tools/require-cmake-build-type MinSizeRel build/mariadb-embedded

      - name: Configure
        run: cmake --preset php-embedded-prod

      - name: Verify embedded production build type
        run: tools/require-cmake-release-build build/php-embedded-prod

      - name: Build embedded PHP targets
        timeout-minutes: 15
        run: cmake --build --preset php-embedded-prod

      - name: Run embedded performance probe
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/default.log

      - name: Run embedded large-row bulk performance probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "20"
          MYLITE_PERF_INSERT_ITERATIONS: "5000"
          MYLITE_PERF_BULK_INSERT_ROWS_PER_STATEMENT: "100"
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/large-row-bulk.log

      - name: Run embedded large-row ownerless attribution probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "20"
          MYLITE_PERF_INSERT_ITERATIONS: "1000"
          MYLITE_PERF_BULK_INSERT_ROWS_PER_STATEMENT: "100"
          MYLITE_PERF_OWNERLESS_PAGE_PUBLISH_STATS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/large-row-ownerless-attribution.log

      - name: Run embedded large-row ownerless page-write attribution probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "20"
          MYLITE_PERF_INSERT_ITERATIONS: "1000"
          MYLITE_PERF_BULK_INSERT_ROWS_PER_STATEMENT: "100"
          MYLITE_PERF_OWNERLESS_PAGE_WRITE_STATS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/large-row-ownerless-page-write-attribution.log

      - name: Run embedded ownerless attribution probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "100"
          MYLITE_PERF_INSERT_ITERATIONS: "100"
          MYLITE_PERF_OWNERLESS_PAGE_PUBLISH_STATS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/ownerless-attribution.log

      - name: Run embedded ownerless append attribution probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "20"
          MYLITE_PERF_INSERT_ITERATIONS: "100"
          MYLITE_PERF_OWNERLESS_APPEND_STATS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/embedded-performance-reports
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe \
            | tee build/embedded-performance-reports/ownerless-append-attribution.log

      - name: Summarize embedded performance reports
        if: always()
        run: |
          set -euo pipefail
          if [ -d build/embedded-performance-reports ]; then
            tools/embedded-performance-rollup --input build/embedded-performance-reports \
              | tee build/embedded-performance-reports/summary.md
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat build/embedded-performance-reports/summary.md >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi

      - name: Upload embedded performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-performance-reports
          path: build/embedded-performance-reports
          if-no-files-found: warn

      - name: Run embedded non-ownerless tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          ctest --preset php-embedded-prod \
            -LE compat.ownerless-cross-process-sql \
            --output-on-failure

      - name: Run embedded ownerless SQL tests
        timeout-minutes: 45
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/mariadb-embedded
          tools/require-cmake-release-build build/php-embedded-prod
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '\n### Embedded ownerless SQL weighted shards\n\n'
              printf '| Field | Value |\n'
              printf '| --- | --- |\n'
              printf '| Preset | `php-embedded-prod` |\n'
              printf '| Selector | `^libmylite\\.ownerless-cross-process-sql\\.` |\n'
              printf '| Parallelism | `--parallel 1` |\n'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
            ctest --preset php-embedded-prod \
              -R '^libmylite\.ownerless-cross-process-sql\.' \
            --parallel 1 \
            --output-on-failure

  wordpress-phpunit-setup:
    name: wordpress-phpunit-mysqli-mylite-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    env:
      # Keep CI reproducible while the local runner continues to default to
      # WordPress trunk for exploratory compatibility checks.
      MYLITE_WORDPRESS_REF: 6ddfc9d9b532c6e95c1266165149815895e2eb56
      MYLITE_WORDPRESS_COMPOSER_CACHE_DIR: build/wordpress-composer-cache
      MYLITE_WORDPRESS_CMAKE_BUILD_DIR: build/wordpress-php-embedded-prod
      MYLITE_WORDPRESS_CMAKE_BUILD_TYPE: Release
      MYLITE_WORDPRESS_TIMING_SUMMARY_PATH: build/wordpress-phpunit-reports/timing-summary-setup.md
      MYLITE_WORDPRESS_REQUIRE_RELEASE_BUILD: "1"
      MYLITE_WORDPRESS_REQUIRE_EXTERNAL_DB_DIR: "1"
      MYLITE_WORDPRESS_PHPUNIT_LOG_JUNIT: "0"
      MYLITE_WORDPRESS_PHPUNIT_NO_LOGGING: "1"
      MYLITE_WORDPRESS_PHPUNIT_PROFILE_CHILD_PROCESSES: "0"
      MYLITE_WORDPRESS_PHPUNIT_CHILD_TIMING_SUMMARY: "0"
      MYLITE_WORDPRESS_PHPUNIT_CHILD_SCRIPT_TIMING_SUMMARY: "0"
      MYLITE_WORDPRESS_PHPUNIT_PROFILE_MYSQLI: "0"
      MYLITE_WORDPRESS_PHPUNIT_KEEPALIVE: "0"
      MYLITE_WORDPRESS_PHPUNIT_STATIC_WPDB_SCAN: "0"
      MYLITE_WORDPRESS_PHPUNIT_CHILD_SKIP_INSTALL: "0"
      MYLITE_WORDPRESS_PHPUNIT_CHILD_RESTORE_BASELINE: "0"
      MYLITE_WORDPRESS_PHPUNIT_SKIP_INSTALL: "0"
      MYLITE_WORDPRESS_DB_DIR: /tmp/mylite-wordpress-tests.mylite
      MYLITE_WORDPRESS_DB_BASELINE_DIR: /tmp/mylite-wordpress-tests.mylite.baseline

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Cache WordPress Composer downloads
        uses: actions/cache@v4
        with:
          path: build/wordpress-composer-cache
          key: ${{ runner.os }}-wordpress-composer-${{ hashFiles('tools/wordpress-phpunit-mysqli-mylite') }}
          restore-keys: |
            ${{ runner.os }}-wordpress-composer-

      - name: Normalize WordPress MariaDB archive source mtimes
        run: tools/normalize-mariadb-embedded-cache-mtimes

      - name: Cache WordPress MariaDB archive build
        uses: actions/cache@v4
        with:
          path: build/wordpress-mariadb-embedded
          key: ${{ runner.os }}-wordpress-mariadb-embedded-${{ hashFiles('mariadb/**', 'cmake/mariadb-embedded-baseline.cmake', 'tools/mariadb-embedded-build') }}

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Mark WordPress setup Docker image build start
        run: |
          set -euo pipefail
          mkdir -p build
          date +%s > build/wordpress-docker-image-build-start.txt

      - name: Set up WordPress setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WordPress setup Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./tools
          file: ./tools/wordpress-phpunit.Dockerfile
          load: true
          tags: mylite-wordpress-phpunit:php83
          cache-from: type=gha,scope=wordpress-phpunit-php83
          cache-to: type=gha,mode=max,scope=wordpress-phpunit-php83

      - name: Record WordPress setup Docker image timing
        if: always()
        run: |
          set -euo pipefail
          docker_start="$(cat build/wordpress-docker-image-build-start.txt)"
          docker_end="$(date +%s)"
          docker_seconds="$((docker_end - docker_start))"
          tools/wordpress-phpunit-append-timing --label docker-image \
            "wordpress_docker_build_seconds=${docker_seconds}" \
            "wordpress_total_seconds=${docker_seconds}"

      - name: Fetch WordPress PHPUnit sources
        env:
          MYLITE_WORDPRESS_PHASE: fetch
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: fetch
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Build MyLite PHP extensions for WordPress PHPUnit
        timeout-minutes: 30
        env:
          MYLITE_WORDPRESS_PHASE: build-php
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: build-php
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Verify WordPress MariaDB embedded production build type
        run: tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded

      - name: Verify WordPress production build type
        run: tools/require-cmake-release-build build/wordpress-php-embedded-prod

      - name: Install WordPress PHPUnit dependencies
        env:
          MYLITE_WORDPRESS_PHASE: dependencies
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: dependencies
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded
          tools/require-cmake-release-build build/wordpress-php-embedded-prod
          tools/wordpress-phpunit-mysqli-mylite

      - name: Prepare WordPress PHPUnit database
        env:
          MYLITE_WORDPRESS_PHASE: prepare-db
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: prepare-db
          MYLITE_WORDPRESS_PHPUNIT_SKIP_INSTALL: "1"
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded
          tools/require-cmake-release-build build/wordpress-php-embedded-prod
          tools/wordpress-phpunit-mysqli-mylite

      - name: Run WordPress mysqli performance probe
        env:
          MYLITE_WORDPRESS_PHASE: perf-probe
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: perf-probe
          MYLITE_WORDPRESS_PERF_PROCESS_ITERATIONS: "5"
          MYLITE_WORDPRESS_PERF_CONNECT_ITERATIONS: "5"
          MYLITE_WORDPRESS_PERF_PROFILE_CONNECT_PROCESSES: "1"
          MYLITE_WORDPRESS_PERF_SQL_ITERATIONS: "1000"
          MYLITE_WORDPRESS_PERF_WRITE_ITERATIONS: "200"
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded
          tools/require-cmake-release-build build/wordpress-php-embedded-prod
          tools/wordpress-phpunit-mysqli-mylite

      - name: Pack WordPress PHPUnit runtime artifact
        run: |
          set -euo pipefail
          pack_start="$(date +%s)"
          runtime_root=build/wordpress-phpunit-runtime-root
          tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded
          tools/require-cmake-release-build build/wordpress-php-embedded-prod
          test -d "${MYLITE_WORDPRESS_DB_BASELINE_DIR}"
          {
            echo "github_sha=${GITHUB_SHA}"
            echo "wordpress_ref=${MYLITE_WORDPRESS_REF}"
            echo "wordpress_sha=$(git -C build/wordpress-develop rev-parse HEAD)"
            echo "mariadb_cmake_build_type=$(sed -n 's/^CMAKE_BUILD_TYPE:[^=]*=//p' build/wordpress-mariadb-embedded/CMakeCache.txt | tail -n 1)"
            echo "mylite_cmake_build_type=$(sed -n 's/^CMAKE_BUILD_TYPE:[^=]*=//p' build/wordpress-php-embedded-prod/CMakeCache.txt | tail -n 1)"
          } > build/wordpress-phpunit-runtime-manifest.txt
          sha256sum \
            build/wordpress-mariadb-embedded/libmysqld/libmariadbd.a \
            build/wordpress-php-embedded-prod/packages/libmylite/libmylite.a \
            build/wordpress-php-embedded-prod/packages/php-ext-mylite/mylite.so \
            build/wordpress-php-embedded-prod/packages/php-ext-mysqli-mylite/mysqli_mylite.so \
            build/wordpress-php-embedded-prod/mylite-wordpress-php \
            build/wordpress-php-embedded-prod/php-conf.d/mylite.ini \
            build/wordpress-phpunit-tools/vendor/bin/phpunit \
            build/wordpress-develop/wp-tests-config.php \
            build/wordpress-phpunit-runtime-manifest.txt \
            > build/wordpress-phpunit-runtime-manifest.sha256
          sha256sum -c build/wordpress-phpunit-runtime-manifest.sha256
          zstd --version
          rm -f \
            build/wordpress-phpunit-runtime.tar.zst \
            build/wordpress-phpunit-db-baseline.tar.zst
          rm -rf "${runtime_root}"
          mkdir -p \
            "${runtime_root}/build/wordpress-develop" \
            "${runtime_root}/build/wordpress-mariadb-embedded/libmysqld" \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/libmylite" \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/php-ext-mylite" \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/php-ext-mysqli-mylite" \
            "${runtime_root}/build/wordpress-php-embedded-prod/php-conf.d"
          tar \
            -C build/wordpress-develop \
            --exclude='./.git/objects' \
            --exclude='./.git/logs' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./tests/e2e' \
            --exclude='./tests/gutenberg' \
            --exclude='./tests/performance' \
            --exclude='./tests/phpstan' \
            --exclude='./tests/qunit' \
            --exclude='./tests/visual-regression' \
            --exclude='./vendor' \
            -cf - \
            . \
            | tar -C "${runtime_root}/build/wordpress-develop" -xf -
          mkdir -p "${runtime_root}/build/wordpress-develop/.git/objects"
          mkdir -p \
            "${runtime_root}/build/wordpress-develop/vendor" \
            "${runtime_root}/build/wordpress-develop/vendor/yoast"
          cp -a \
            build/wordpress-develop/vendor/autoload.php \
            build/wordpress-develop/vendor/composer \
            "${runtime_root}/build/wordpress-develop/vendor/"
          cp -a \
            build/wordpress-develop/vendor/yoast/phpunit-polyfills \
            "${runtime_root}/build/wordpress-develop/vendor/yoast/"
          mkdir -p "${runtime_root}/build/wordpress-develop/tests/qunit"
          cp -a \
            build/wordpress-develop/tests/qunit/fixtures \
            "${runtime_root}/build/wordpress-develop/tests/qunit/"
          cp -a build/wordpress-phpunit-tools "${runtime_root}/build/"
          cp -a \
            build/wordpress-mariadb-embedded/CMakeCache.txt \
            "${runtime_root}/build/wordpress-mariadb-embedded/CMakeCache.txt"
          cp -a \
            build/wordpress-mariadb-embedded/libmysqld/libmariadbd.a \
            "${runtime_root}/build/wordpress-mariadb-embedded/libmysqld/"
          cp -a \
            build/wordpress-php-embedded-prod/CMakeCache.txt \
            "${runtime_root}/build/wordpress-php-embedded-prod/CMakeCache.txt"
          cp -a \
            build/wordpress-php-embedded-prod/packages/libmylite/libmylite.a \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/libmylite/"
          cp -a \
            build/wordpress-php-embedded-prod/packages/php-ext-mylite/mylite.so \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/php-ext-mylite/"
          cp -a \
            build/wordpress-php-embedded-prod/packages/php-ext-mysqli-mylite/mysqli_mylite.so \
            "${runtime_root}/build/wordpress-php-embedded-prod/packages/php-ext-mysqli-mylite/"
          cp -a \
            build/wordpress-php-embedded-prod/mylite-wordpress-php \
            "${runtime_root}/build/wordpress-php-embedded-prod/"
          cp -a \
            build/wordpress-php-embedded-prod/php-conf.d/mylite.ini \
            "${runtime_root}/build/wordpress-php-embedded-prod/php-conf.d/"
          cp -a \
            build/wordpress-phpunit-runtime-manifest.txt \
            build/wordpress-phpunit-runtime-manifest.sha256 \
            "${runtime_root}/build/"
          ( cd "${runtime_root}" && sha256sum -c build/wordpress-phpunit-runtime-manifest.sha256 )
          tar -C "${runtime_root}" -cf - build \
            | zstd -T0 -3 -o build/wordpress-phpunit-runtime.tar.zst
          tar -C "$(dirname "${MYLITE_WORDPRESS_DB_BASELINE_DIR}")" \
            -cf - \
            "$(basename "${MYLITE_WORDPRESS_DB_BASELINE_DIR}")" \
            | zstd -T0 -3 -o build/wordpress-phpunit-db-baseline.tar.zst
          pack_end="$(date +%s)"
          pack_seconds="$((pack_end - pack_start))"
          runtime_root_bytes="$(du -sb "${runtime_root}" | awk '{print $1}')"
          runtime_tar_bytes="$(wc -c < build/wordpress-phpunit-runtime.tar.zst | tr -d '[:space:]')"
          db_baseline_tar_bytes="$(wc -c < build/wordpress-phpunit-db-baseline.tar.zst | tr -d '[:space:]')"
          tools/wordpress-phpunit-append-timing --label artifact-pack \
            "wordpress_artifact_pack_seconds=${pack_seconds}" \
            "wordpress_artifact_pack_runtime_root_bytes=${runtime_root_bytes}" \
            "wordpress_artifact_pack_runtime_tar_bytes=${runtime_tar_bytes}" \
            "wordpress_artifact_pack_db_baseline_tar_bytes=${db_baseline_tar_bytes}" \
            "wordpress_total_seconds=${pack_seconds}"

      - name: Mark WordPress PHPUnit runtime artifact upload start
        run: |
          set -euo pipefail
          date +%s > build/wordpress-phpunit-runtime-upload-start.txt

      - name: Upload WordPress PHPUnit runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-runtime
          path: |
            build/wordpress-phpunit-runtime.tar.zst
            build/wordpress-phpunit-db-baseline.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Record WordPress PHPUnit runtime artifact upload timing
        if: always()
        run: |
          set -euo pipefail
          upload_start="$(cat build/wordpress-phpunit-runtime-upload-start.txt)"
          upload_end="$(date +%s)"
          upload_seconds="$((upload_end - upload_start))"
          tools/wordpress-phpunit-append-timing --label artifact-upload \
            "wordpress_artifact_upload_seconds=${upload_seconds}" \
            "wordpress_total_seconds=${upload_seconds}"

      - name: Upload WordPress setup timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-timing-summary-setup
          path: build/wordpress-phpunit-reports/timing-summary-setup.md
          if-no-files-found: warn

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            "${MYLITE_WORDPRESS_DB_DIR}" \
            "${MYLITE_WORDPRESS_DB_BASELINE_DIR}" \
            build/wordpress-phpunit-runtime.tar.zst \
            build/wordpress-phpunit-db-baseline.tar.zst \
            build/wordpress-phpunit-runtime-root \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-composer-cache \
            build/wordpress-mariadb-embedded \
            build/wordpress-php-embedded-prod \
            2>/dev/null || true
          df -h .

  wordpress-phpunit-runtime-image:
    name: wordpress-phpunit-mysqli-mylite-runtime-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MYLITE_WORDPRESS_TIMING_SUMMARY_PATH: build/wordpress-phpunit-reports/timing-summary-runtime-image.md

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Mark WordPress runtime Docker image build start
        run: |
          set -euo pipefail
          mkdir -p build/wordpress-phpunit-reports
          date +%s > build/wordpress-runtime-docker-image-build-start.txt

      - name: Set up WordPress runtime Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WordPress runtime Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./tools
          file: ./tools/wordpress-phpunit-runtime.Dockerfile
          load: true
          tags: mylite-wordpress-phpunit-runtime:php83
          cache-from: |
            type=gha,scope=wordpress-phpunit-runtime-php83
            type=gha,scope=wordpress-phpunit-php83
          cache-to: type=gha,mode=max,scope=wordpress-phpunit-runtime-php83

      - name: Record WordPress runtime Docker image timing
        if: always()
        run: |
          set -euo pipefail
          docker_start="$(cat build/wordpress-runtime-docker-image-build-start.txt)"
          docker_end="$(date +%s)"
          docker_seconds="$((docker_end - docker_start))"
          tools/wordpress-phpunit-append-timing --label runtime-docker-image-build \
            "wordpress_runtime_docker_cache_seconds=${docker_seconds}" \
            "wordpress_total_seconds=${docker_seconds}"

      - name: Upload WordPress runtime Docker image timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-timing-summary-runtime-image
          path: build/wordpress-phpunit-reports/timing-summary-runtime-image.md
          if-no-files-found: warn

      - name: Show generated artifact sizes
        if: always()
        run: |
          docker image inspect mylite-wordpress-phpunit-runtime:php83 >/dev/null || true
          df -h .

