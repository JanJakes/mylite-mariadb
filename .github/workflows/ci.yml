name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-clang
            os: macos-latest
            cc: clang
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-24.04
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            exit 0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
        run: cmake --preset prod

      - name: Verify production build type
        run: tools/require-cmake-release-build build/prod

      - name: Build
        run: cmake --build --preset prod

      - name: Test
        run: ctest --preset prod

  embedded:
    name: ubuntu-embedded
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install embedded build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            libcrypt-dev \
            libncurses-dev \
            libpcre2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            php-cli \
            php-dev \
            zlib1g-dev

      - name: Build MariaDB embedded archive
        run: tools/mariadb-embedded-build all

      - name: Verify MariaDB embedded production build type
        run: tools/require-cmake-build-type MinSizeRel build/mariadb-embedded

      - name: Configure
        run: cmake --preset php-embedded-prod

      - name: Verify embedded production build type
        run: tools/require-cmake-release-build build/php-embedded-prod

      - name: Build
        run: cmake --build --preset php-embedded-prod

      - name: Run embedded non-ownerless tests
        run: >-
          ctest --preset php-embedded-prod
          -LE compat.ownerless-cross-process-sql
          --parallel 2
          --output-on-failure

      - name: Run embedded ownerless SQL tests
        run: |
          set -euo pipefail
          ownerless_sql_test=build/php-embedded-prod/packages/libmylite/mylite_ownerless_cross_process_sql_test
          ownerless_sql_case_count="$("$ownerless_sql_test" sql-case-count)"
          for case_index in $(seq 0 "$((ownerless_sql_case_count - 1))"); do
            rm -rf /tmp/mylite-ownerless-sql.*
            "$ownerless_sql_test" sql-case "$case_index"
          done

      - name: Run embedded performance probe
        run: build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe

      - name: Run embedded ownerless attribution probe
        env:
          MYLITE_PERF_OPEN_CLOSE_ITERATIONS: "1"
          MYLITE_PERF_SELECT_ITERATIONS: "100"
          MYLITE_PERF_INSERT_ITERATIONS: "100"
          MYLITE_PERF_OWNERLESS_PAGE_PUBLISH_STATS: "1"
        run: build/php-embedded-prod/packages/libmylite/mylite_embedded_performance_probe

  wordpress-phpunit:
    name: wordpress-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      # Keep CI reproducible while the local runner continues to default to
      # WordPress trunk for exploratory compatibility checks.
      MYLITE_WORDPRESS_REF: 6ddfc9d9b532c6e95c1266165149815895e2eb56
      MYLITE_WORDPRESS_COMPOSER_CACHE_DIR: build/wordpress-composer-cache
      MYLITE_WORDPRESS_CMAKE_BUILD_DIR: build/wordpress-php-embedded-prod
      MYLITE_WORDPRESS_CMAKE_BUILD_TYPE: Release
      MYLITE_WORDPRESS_REQUIRE_RELEASE_BUILD: "1"
      MYLITE_WORDPRESS_REQUIRE_EXTERNAL_DB_DIR: "1"
      MYLITE_WORDPRESS_PHPUNIT_ISOLATED_FILTER: '^(Tests_Admin_ExportWp|Tests_Admin_WpAutomaticUpdater|Tests_Admin_WpUpgrader|Tests_Ajax_wpAjaxResponse|Tests_Filesystem_WpFilesystemDirect_Chmod|Tests_Filesystem_WpFilesystemDirect_Mkdir|Tests_Formatting_Emoji|Tests_Functions_WpUniquePrefixedId|Tests_oEmbed_HTTP_Headers|Tests_Sitemaps_Sitemaps|Tests_Theme)(::|$)'
      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER: '^(?!(Tests_DB|Tests_Admin_ExportWp|Tests_Admin_WpAutomaticUpdater|Tests_Admin_WpUpgrader|Tests_Ajax_wpAjaxResponse|Tests_Filesystem_WpFilesystemDirect_Chmod|Tests_Filesystem_WpFilesystemDirect_Mkdir|Tests_Formatting_Emoji|Tests_Functions_WpUniquePrefixedId|Tests_oEmbed_HTTP_Headers|Tests_Sitemaps_Sitemaps|Tests_Theme)(::|$))'

    steps:
      - uses: actions/checkout@v5

      - name: Cache WordPress Composer downloads
        uses: actions/cache@v4
        with:
          path: build/wordpress-composer-cache
          key: ${{ runner.os }}-wordpress-composer-${{ hashFiles('tools/wordpress-phpunit-mysqli-mylite') }}
          restore-keys: |
            ${{ runner.os }}-wordpress-composer-

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build WordPress PHPUnit Docker image
        env:
          MYLITE_WORDPRESS_PHASE: docker-image
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Fetch WordPress PHPUnit sources
        env:
          MYLITE_WORDPRESS_PHASE: fetch
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Build MyLite PHP extensions for WordPress PHPUnit
        env:
          MYLITE_WORDPRESS_PHASE: build-php
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Verify WordPress MariaDB embedded production build type
        run: tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded

      - name: Verify WordPress production build type
        run: tools/require-cmake-release-build build/wordpress-php-embedded-prod

      - name: Install WordPress PHPUnit dependencies
        env:
          MYLITE_WORDPRESS_PHASE: dependencies
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Prepare WordPress PHPUnit database
        env:
          MYLITE_WORDPRESS_PHASE: prepare-db
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Run WordPress mysqli performance probe
        env:
          MYLITE_WORDPRESS_PHASE: perf-probe
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_PERF_PROCESS_ITERATIONS: "5"
          MYLITE_WORDPRESS_PERF_CONNECT_ITERATIONS: "5"
          MYLITE_WORDPRESS_PERF_SQL_ITERATIONS: "1000"
          MYLITE_WORDPRESS_PERF_WRITE_ITERATIONS: "200"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Run WordPress PHPUnit database suite (test only)
        env:
          MYLITE_WORDPRESS_PHASE: phpunit
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite --filter '^Tests_DB'

      - name: Run WordPress PHPUnit process-isolated suite (test only)
        env:
          MYLITE_WORDPRESS_PHASE: phpunit
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite --filter "$MYLITE_WORDPRESS_PHPUNIT_ISOLATED_FILTER"

      - name: Run WordPress PHPUnit non-isolated remaining suite (test only)
        env:
          MYLITE_WORDPRESS_PHASE: phpunit
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite --filter "$MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER"

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            /tmp/mylite-wordpress-tests-*.mylite \
            build/wordpress-tests.mylite \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-composer-cache \
            build/wordpress-mariadb-embedded \
            build/wordpress-php-embedded-prod \
            2>/dev/null || true
          df -h .

  clang-tools:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset prod

      - name: Verify production build type
        run: tools/require-cmake-release-build build/prod

      - name: Check formatting
        run: cmake --build --preset format-check-prod

      - name: Run clang-tidy
        run: cmake --build --preset tidy-prod
