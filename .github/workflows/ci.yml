name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-clang
            os: macos-latest
            cc: clang
          - name: ubuntu-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: ubuntu-clang
            os: ubuntu-24.04
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            exit 0
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  embedded:
    name: ubuntu-embedded
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install embedded build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            cmake \
            libcrypt-dev \
            libncurses-dev \
            libpcre2-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            php-cli \
            php-dev \
            zlib1g-dev

      - name: Build MariaDB embedded archive
        run: tools/mariadb-embedded-build all

      - name: Configure
        run: cmake --preset php-embedded-dev

      - name: Build
        run: cmake --build --preset php-embedded-dev

      - name: Test
        run: |
          ctest --preset php-embedded-dev -LE compat.ownerless-cross-process-sql --parallel 2
          ctest --preset php-embedded-dev -L compat.ownerless-cross-process-sql --parallel 2

      - name: Run embedded performance probe
        run: build/php-embedded-dev/packages/libmylite/mylite_embedded_performance_probe

  wordpress-phpunit:
    name: wordpress-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      # Keep CI reproducible while the local runner continues to default to
      # WordPress trunk for exploratory compatibility checks.
      MYLITE_WORDPRESS_REF: 6ddfc9d9b532c6e95c1266165149815895e2eb56
      MYLITE_WORDPRESS_COMPOSER_CACHE_DIR: build/wordpress-composer-cache
      MYLITE_WORDPRESS_PHPUNIT_LOG_JUNIT: 1
      MYLITE_WORDPRESS_PHPUNIT_REPORT_DIR: build/wordpress-phpunit-reports

    steps:
      - uses: actions/checkout@v5

      - name: Cache WordPress Composer downloads
        uses: actions/cache@v4
        with:
          path: build/wordpress-composer-cache
          key: ${{ runner.os }}-wordpress-composer-${{ hashFiles('tools/wordpress-phpunit-mysqli-mylite') }}
          restore-keys: |
            ${{ runner.os }}-wordpress-composer-

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Build WordPress PHPUnit Docker image
        env:
          MYLITE_WORDPRESS_PHASE: docker-image
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Fetch WordPress PHPUnit sources
        env:
          MYLITE_WORDPRESS_PHASE: fetch
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Build MyLite PHP extensions for WordPress PHPUnit
        env:
          MYLITE_WORDPRESS_PHASE: build-php
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Install WordPress PHPUnit dependencies
        env:
          MYLITE_WORDPRESS_PHASE: dependencies
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Prepare WordPress PHPUnit database
        env:
          MYLITE_WORDPRESS_PHASE: prepare-db
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Run WordPress mysqli performance probe
        env:
          MYLITE_WORDPRESS_PHASE: perf-probe
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_PERF_PROCESS_ITERATIONS: "3"
          MYLITE_WORDPRESS_PERF_CONNECT_ITERATIONS: "3"
          MYLITE_WORDPRESS_PERF_SQL_ITERATIONS: "1000"
          MYLITE_WORDPRESS_PERF_WRITE_ITERATIONS: "200"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Run WordPress PHPUnit suite
        env:
          MYLITE_WORDPRESS_PHASE: phpunit
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
        run: tools/wordpress-phpunit-mysqli-mylite

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            /tmp/mylite-wordpress-tests-*.mylite \
            build/wordpress-tests.mylite \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-composer-cache \
            build/wordpress-phpunit-reports \
            build/wordpress-mariadb-embedded \
            build/wordpress-php-embedded \
            2>/dev/null || true
          df -h .

      - name: Upload WordPress PHPUnit timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-junit
          path: build/wordpress-phpunit-reports/phpunit-junit.xml
          if-no-files-found: ignore

  clang-tools:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset dev

      - name: Check formatting
        run: cmake --build --preset format-check

      - name: Run clang-tidy
        run: cmake --build --preset tidy
