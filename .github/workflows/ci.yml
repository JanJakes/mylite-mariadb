      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_FORMAT_DEPENDENCIES_EMBED_RE: 'Tests_Formatting|Tests_Date|Tests_Dependencies|Tests_Script_Modules|Tests_Widgets|Test_Autoembed|Tests_oEmbed|Test_oEmbed|Tests_Embed|Tests_Kses|Tests_Shortcode|REST_Block_Type_Controller_Test'
      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE: 'Tests_Admin|Tests_Ajax|Tests_Multisite|Tests_General|Tests_Functions|Tests_Cron|Tests_L10n|Tests_Pluggable|WP_Translation'
      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_AI_CONNECTORS_RE: 'Tests_AI|Tests_Abilities|Test_Abilities|Tests_Connectors'
      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_NAVIGATION_RE: 'Test_WP_Customize|Tests_Link|Tests_Rewrite|Tests_Category|Tests_Sitemaps|Tests_Menu|Tests_Nav|WP_Navigation|Tests_Editor|WP_Classic'
      MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_RUNTIME_IO_RE: 'Tests_Filesystem|WP_Filesystem|Tests_HTTP|WP_HTTP|Tests_HTTPS|Tests_Compat|Test_Compat|Tests_File|Tests_Error|Tests_Upload|Tests_Import'
      WORDPRESS_PHPUNIT_SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Show runner resources
        run: |
          df -h .
          free -h
          docker version

      - name: Mark WordPress shard Docker image build start
        run: |
          set -euo pipefail
          mkdir -p build/wordpress-phpunit-reports
          date +%s > build/wordpress-docker-image-build-start.txt

      - name: Set up WordPress shard Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WordPress shard runtime Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./tools
          file: ./tools/wordpress-phpunit-runtime.Dockerfile
          load: true
          tags: mylite-wordpress-phpunit:php83
          cache-from: |
            type=gha,scope=wordpress-phpunit-runtime-php83
            type=gha,scope=wordpress-phpunit-php83

      - name: Record WordPress shard Docker image timing
        if: always()
        run: |
          set -euo pipefail
          docker_start="$(cat build/wordpress-docker-image-build-start.txt)"
          docker_end="$(date +%s)"
          docker_seconds="$((docker_end - docker_start))"
          docker image inspect mylite-wordpress-phpunit:php83 >/dev/null
          tools/wordpress-phpunit-append-timing --label docker-image-${{ matrix.shard }} \
            "wordpress_docker_build_seconds=${docker_seconds}" \
            "wordpress_total_seconds=${docker_seconds}"

      - name: Mark WordPress PHPUnit runtime root artifact download start
        run: |
          set -euo pipefail
          mkdir -p build/wordpress-phpunit-reports
          date +%s > build/wordpress-phpunit-runtime-root-download-start.txt

      - name: Download WordPress PHPUnit runtime root artifact
        uses: actions/download-artifact@v4
        with:
          name: wordpress-phpunit-runtime
          path: build/wordpress-phpunit-runtime-artifact

      - name: Record WordPress PHPUnit runtime root artifact download timing
        if: always()
        run: |
          set -euo pipefail
          download_end="$(date +%s)"
          download_start_missing=0
          if [ -f build/wordpress-phpunit-runtime-root-download-start.txt ]; then
            download_start="$(cat build/wordpress-phpunit-runtime-root-download-start.txt)"
          else
            download_start="${download_end}"
            download_start_missing=1
          fi
          download_seconds="$((download_end - download_start))"
          runtime_tar_bytes=0
          db_baseline_tar_bytes=0
          if [ -f build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-runtime.tar.zst ]; then
            runtime_tar_bytes="$(wc -c < build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-runtime.tar.zst | tr -d '[:space:]')"
          fi
          if [ -f build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-db-baseline.tar.zst ]; then
            db_baseline_tar_bytes="$(wc -c < build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-db-baseline.tar.zst | tr -d '[:space:]')"
          fi
          tools/wordpress-phpunit-append-timing --label artifact-runtime-download-${{ matrix.shard }} \
            "wordpress_artifact_download_seconds=${download_seconds}" \
            "wordpress_runtime_artifact_download_seconds=${download_seconds}" \
            "wordpress_artifact_download_start_missing=${download_start_missing}" \
            "wordpress_artifact_download_runtime_tar_bytes=${runtime_tar_bytes}" \
            "wordpress_artifact_download_db_baseline_tar_bytes=${db_baseline_tar_bytes}" \
            "wordpress_total_seconds=${download_seconds}"

      - name: Extract WordPress PHPUnit runtime artifact
        run: |
          set -euo pipefail
          extract_start="$(date +%s)"
          rm -rf \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-mariadb-embedded \
            build/wordpress-php-embedded-prod \
            "${MYLITE_WORDPRESS_DB_DIR}" \
            "${MYLITE_WORDPRESS_DB_BASELINE_DIR}"
          zstd -dc build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-runtime.tar.zst \
            | tar -xf -
          zstd -dc build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-db-baseline.tar.zst \
            | tar -xf - -C "$(dirname "${MYLITE_WORDPRESS_DB_BASELINE_DIR}")"
          sha256sum -c build/wordpress-phpunit-runtime-manifest.sha256
          grep -Fx "github_sha=${GITHUB_SHA}" build/wordpress-phpunit-runtime-manifest.txt
          grep -Fx "wordpress_ref=${MYLITE_WORDPRESS_REF}" build/wordpress-phpunit-runtime-manifest.txt
          extract_end="$(date +%s)"
          extract_seconds="$((extract_end - extract_start))"
          runtime_tar_bytes="$(wc -c < build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-runtime.tar.zst | tr -d '[:space:]')"
          db_baseline_tar_bytes="$(wc -c < build/wordpress-phpunit-runtime-artifact/wordpress-phpunit-db-baseline.tar.zst | tr -d '[:space:]')"
          tools/wordpress-phpunit-append-timing --label artifact-extract-${{ matrix.shard }} \
            "wordpress_artifact_extract_seconds=${extract_seconds}" \
            "wordpress_artifact_extract_runtime_tar_bytes=${runtime_tar_bytes}" \
            "wordpress_artifact_extract_db_baseline_tar_bytes=${db_baseline_tar_bytes}" \
            "wordpress_total_seconds=${extract_seconds}"

      - name: Verify WordPress MariaDB embedded production build type
        run: tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded

      - name: Verify WordPress production build type
        run: tools/require-cmake-release-build build/wordpress-php-embedded-prod

      - name: Run WordPress PHPUnit shard (test only)
        env:
          MYLITE_WORDPRESS_PHASE: phpunit
          MYLITE_WORDPRESS_SKIP_DOCKER_BUILD: "1"
          MYLITE_WORDPRESS_TIMING_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          tools/require-cmake-build-type MinSizeRel build/wordpress-mariadb-embedded
          tools/require-cmake-release-build build/wordpress-php-embedded-prod
          run_wordpress_phpunit_filter() {
            local label="$1"
            local filter="$2"
            shift 2
            env "$@" \
              MYLITE_WORDPRESS_TIMING_LABEL="${label}" \
              tools/wordpress-phpunit-mysqli-mylite --filter "${filter}"
          }
          combine_wordpress_phpunit_filters() {
            local combined=""
            local filter
            for filter in "$@"; do
              if [ -z "${combined}" ]; then
                combined="(?:${filter})"
              else
                combined="${combined}|(?:${filter})"
              fi
            done
            printf '%s\n' "${combined}"
          }
          record_wordpress_phpunit_group() {
            local shard="$1"
            local start_seconds="$2"
            local elapsed_seconds
            elapsed_seconds="$(($(date +%s) - start_seconds))"
            tools/wordpress-phpunit-append-timing \
              --label "group-phpunit-${shard}" \
              "wordpress_phpunit_shell_real_seconds=${elapsed_seconds}" \
              "wordpress_total_seconds=${elapsed_seconds}"
          }
          case "${WORDPRESS_PHPUNIT_SHARD}" in
            db-short)
              group_start="$(date +%s)"
              run_wordpress_phpunit_filter \
                phpunit-db \
                '^Tests_DB'
              run_wordpress_phpunit_filter \
                phpunit-db-profile \
                '^Tests_DB' \
                MYLITE_WORDPRESS_PHPUNIT_PROFILE_MYSQLI=1
              record_wordpress_phpunit_group "${WORDPRESS_PHPUNIT_SHARD}" "${group_start}"
              exit 0
              ;;
            deferred-reconnect-baseline-restored)
              wordpress_phpunit_filter="${MYLITE_WORDPRESS_PHPUNIT_DEFERRED_RECONNECT_FILTER}"
              ;;
            deferred-reconnect-skip-install)
              wordpress_phpunit_filter="${MYLITE_WORDPRESS_PHPUNIT_DEFERRED_RECONNECT_SKIP_INSTALL_FILTER}"
              ;;
            deferred-reconnect-ui)
              wordpress_phpunit_filter="${MYLITE_WORDPRESS_PHPUNIT_DEFERRED_RECONNECT_UI_FILTER}"
              ;;
            non-isolated-rest-content-primary-posts)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_PRIMARY_POSTS_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-rest-content-primary-other)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_PRIMARY_OTHER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-rest-short)
              wordpress_phpunit_filter="$(combine_wordpress_phpunit_filters \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_HISTORY_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_TESTS_REST_RE}))(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_TESTS_REST_FONT_ICON_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_CONTROLLER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}")"
              ;;
            non-isolated-rest-content-support)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_SUPPORT_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-rest-controller-tests-rest-other)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_TESTS_REST_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_TESTS_REST_FONT_ICON_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_CONTROLLER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-rest-controller-wp-short)
              wordpress_phpunit_filter="$(combine_wordpress_phpunit_filters \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_WP_TEST_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_CONTROLLER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?=.*Controller)(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTROLLER_WP_REST_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_CONTENT_CONTROLLER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}")"
              ;;
            non-isolated-rest-other)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}))(?!.*Controller)${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-query-filter)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_FILTER_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-query-core)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_CORE_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-canonical)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CANONICAL_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-theme)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_THEME_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-block-library-supports-short)
              wordpress_phpunit_filter="$(combine_wordpress_phpunit_filters \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_LIBRARY_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_SUPPORTS_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}")"
              ;;
            non-isolated-block-template-binding)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TEMPLATE_BINDING_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-content-media-short)
              wordpress_phpunit_filter="$(combine_wordpress_phpunit_filters \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_SETTINGS_META_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}")"
              ;;
            non-isolated-comment)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_COMMENT_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-xmlrpc)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_XMLRPC_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-content-post-template)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_POST_TEMPLATE_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-content-term-taxonomy)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_TERM_TAXONOMY_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-user-auth)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-remaining-short)
              wordpress_phpunit_filter="$(combine_wordpress_phpunit_filters \
                "^(?=(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_HTML_INTERACTIVITY_RE})(?:_|::|$))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?=(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_IMAGE_RE})(?:_|::|$))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?!${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_RE}(?:_|::|$))(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_AI_CONNECTORS_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}" \
                "^(?!${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_RE}(?:_|::|$))(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_RUNTIME_IO_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}")"
              ;;
            non-isolated-remaining-platform-format-dependencies-embed)
              wordpress_phpunit_filter="^(?=(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_FORMAT_DEPENDENCIES_EMBED_RE})(?:_|::|$))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-remaining-admin-site)
              wordpress_phpunit_filter="^(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-remaining-navigation)
              wordpress_phpunit_filter="^(?!${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_RE}(?:_|::|$))(?=.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_NAVIGATION_RE}))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            non-isolated-remaining-other)
              wordpress_phpunit_filter="^(?!${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_PLATFORM_RE}(?:_|::|$))(?!.*(?:${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REST_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_QUERY_THEME_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_BLOCK_TOKEN_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_MEDIA_COMMENT_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_CONTENT_DATA_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_USER_AUTH_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_ADMIN_SITE_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_AI_CONNECTORS_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_NAVIGATION_RE}|${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_REMAINING_RUNTIME_IO_RE}))${MYLITE_WORDPRESS_PHPUNIT_NON_ISOLATED_FILTER#^}"
              ;;
            *)
              echo "Unknown WordPress PHPUnit shard: ${WORDPRESS_PHPUNIT_SHARD}" >&2
              exit 1
              ;;
          esac
          tools/wordpress-phpunit-mysqli-mylite --filter "${wordpress_phpunit_filter}"

      - name: Show WordPress shard timing summary
        if: always()
        run: |
          set -euo pipefail
          summary="${MYLITE_WORDPRESS_TIMING_SUMMARY_PATH}"
          if [ -f "${summary}" ]; then
            cat "${summary}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "Missing WordPress timing summary: ${summary}"
          fi

      - name: Upload WordPress shard timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-timing-summary-${{ matrix.shard }}
          path: build/wordpress-phpunit-reports/timing-summary-${{ matrix.shard }}.md
          if-no-files-found: warn

      - name: Show generated artifact sizes
        if: always()
        run: |
          du -sh \
            /tmp/mylite-wordpress-tests-*.mylite \
            build/wordpress-tests.mylite \
            build/wordpress-develop \
            build/wordpress-phpunit-tools \
            build/wordpress-composer-cache \
            build/wordpress-mariadb-embedded \
            build/wordpress-php-embedded-prod \
            2>/dev/null || true
          df -h .

  wordpress-phpunit:
    name: wordpress-phpunit-mysqli-mylite
    runs-on: ubuntu-24.04
    needs:
      - wordpress-phpunit-setup
      - wordpress-phpunit-runtime-image
      - wordpress-phpunit-shard
    if: always()
    timeout-minutes: 10

    env:
      MYLITE_WORDPRESS_TIMING_SUMMARY_PATH: build/wordpress-phpunit-reports/timing-summary.md

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Download WordPress timing summaries
        uses: actions/download-artifact@v4
        with:
          pattern: wordpress-phpunit-timing-summary-*
          path: build/wordpress-phpunit-reports/parts
          merge-multiple: true

      - name: Show WordPress timing summary
        if: always()
        run: |
          set -euo pipefail
          summary="${MYLITE_WORDPRESS_TIMING_SUMMARY_PATH}"
          mkdir -p "$(dirname "${summary}")"
          {
            echo "## WordPress PHPUnit Timing"
            echo
            echo "| label | metric | value |"
            echo "| --- | --- | ---: |"
            while IFS= read -r part; do
              awk '
                /^\|/ {
                  fields = split($0, cells, "|")
                  if (fields < 4) {
                    next
                  }
                  label = cells[2]
                  metric = cells[3]
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", label)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", metric)
                  if (label == "label" || label == "---" || metric == "---") {
                    next
                  }
                  print
                }
              ' "${part}"
            done < <(find build/wordpress-phpunit-reports/parts -type f -name 'timing-summary*.md' | sort)
          } > "${summary}"
          if ! tools/wordpress-phpunit-timing-rollup --input "${summary}" --append; then
            echo "WordPress timing rollup unavailable for ${summary}" >&2
          fi
          cat "${summary}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload WordPress timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-phpunit-timing-summary
          path: build/wordpress-phpunit-reports/timing-summary.md
          if-no-files-found: warn

      - name: Check WordPress PHPUnit shard results
        env:
          WORDPRESS_SETUP_RESULT: ${{ needs.wordpress-phpunit-setup.result }}
          WORDPRESS_RUNTIME_IMAGE_RESULT: ${{ needs.wordpress-phpunit-runtime-image.result }}
          WORDPRESS_SHARD_RESULT: ${{ needs.wordpress-phpunit-shard.result }}
        run: |
          set -euo pipefail
          echo "wordpress_phpunit_setup_result=${WORDPRESS_SETUP_RESULT}"
          echo "wordpress_phpunit_runtime_image_result=${WORDPRESS_RUNTIME_IMAGE_RESULT}"
          echo "wordpress_phpunit_shard_result=${WORDPRESS_SHARD_RESULT}"
          test "${WORDPRESS_SETUP_RESULT}" = "success"
          test "${WORDPRESS_RUNTIME_IMAGE_RESULT}" = "success"
          test "${WORDPRESS_SHARD_RESULT}" = "success"

  clang-tools:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Audit CI production build configuration
        run: tools/check-ci-production-builds

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset prod

      - name: Verify production build type
        run: tools/require-cmake-release-build build/prod

      - name: Check formatting
        run: |
          set -euo pipefail
          tools/require-cmake-release-build build/prod
          cmake --build --preset format-check-prod

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          tools/require-cmake-release-build build/prod
          cmake --build --preset tidy-prod
